[project]
name = "paid-ia"
version = "0.0.0"
description = "Subsistema de asistencia por IA de la PAID (PROMPT.md, Parte B)"
requires-python = ">=3.12"

# Versiones fijadas, sin rangos abiertos: red cerrada con indice espejado
# (A.1). Un rango abierto rompe la reproducibilidad.
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
# Se instalan solo donde haya inferencia. La Parte A no los necesita (IA6).
inferencia = [
  "sentence-transformers==3.3.1",
  "outlines==0.1.11",
]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.2",
  "mypy==1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
