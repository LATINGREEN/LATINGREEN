server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aplicacion de una sola pagina: cualquier ruta cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La API vive en otro contenedor de la misma red interna.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # R2 — la API conoce la IP de origen por esta cabecera. nginx AÑADE la
        # direccion real al final; lo que el cliente haya escrito antes no
        # cuenta (apps/api/src/seguridad/ip-origen.ts, PROXIES_DE_CONFIANZA).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A.2.1 — Politica de seguridad de contenido sin origenes externos.
    # `default-src 'self'` es lo que convierte «no llamamos a otros sitios» de
    # convencion en algo que el navegador impone. En internet, ademas, es la
    # primera defensa contra un script inyectado.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Teselas PMTiles: peticiones por rango. Sin esto MapLibre no puede leerlas.
    location /teselas/ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
