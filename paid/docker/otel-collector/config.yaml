# Colector OpenTelemetry local.
#
# A.2.1 / IA7 — **Sin telemetria saliente.** No hay ningun exportador hacia un
# servicio externo, y no se debe anadir: la plataforma esta clasificada como
# «Informacion Publico Clasificado», este donde este desplegada (D-38).
#
# Si alguien anade aqui un exporter `otlphttp` apuntando a un dominio de
# internet, esta sacando datos de la plataforma hacia un tercero.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
  # Nada de cuerpos de peticion ni credenciales en las trazas.
  attributes/limpiar:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete

exporters:
  # Unico destino en el entorno local: la salida estandar del contenedor.
  debug:
    verbosity: normal
  # TODO(despliegue): apuntar a la instancia propia de Tempo/Jaeger que JACID
  # designe. NUNCA a un servicio de un tercero.

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/limpiar, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
