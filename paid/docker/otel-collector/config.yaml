# Colector OpenTelemetry local.
#
# A.2.1 / IA7 — **Sin telemetria saliente.** No hay ningun exportador hacia un
# servicio externo, y no se puede anadir: la plataforma corre en la Intranet
# ARC y esta clasificada como «Informacion Publico Clasificado».
#
# Si alguien anade aqui un exporter `otlphttp` apuntando a un dominio de
# internet, esta sacando datos de la red cerrada.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
  # Nada de cuerpos de peticion ni credenciales en las trazas.
  attributes/limpiar:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete

exporters:
  # Unico destino en el entorno local: la salida estandar del contenedor.
  debug:
    verbosity: normal
  # TODO(despliegue): en la Intranet ARC, apuntar a la instancia local de
  # Tempo/Jaeger que JACID designe. NUNCA a un servicio en internet.

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/limpiar, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
