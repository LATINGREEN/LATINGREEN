name: Publicar juego en GitHub Pages

on:
  push:
    branches:
      - claude/waste-sorting-arcade-game-fs3mcs
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages (se activa solo la primera vez)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el juego
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
