# nginx delante de gunicorn. Es la ÚNICA puerta publicada. El TLS se termina
# aquí o en un proxy anterior (entonces SIGIT_PROXIES_DE_CONFIANZA=2).
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;          # 10 MB de soportes por jornada, con margen.
    server_tokens off;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # nginx AÑADE la IP real al final; la aplicación solo cree esa entrada.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
