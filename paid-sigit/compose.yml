# PAID SIGIT Versión 2026 — despliegue con Docker Compose.
#   cp .env.example .env   # y cambie TODAS las claves
#   docker compose up -d --build
# Solo nginx queda publicado. PostgreSQL escucha únicamente en la red interna.
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_CLAVE_ADMIN:?defina POSTGRES_CLAVE_ADMIN}
      POSTGRES_DB: postgres
      SIGIT_CLAVE_PROPIETARIO: ${SIGIT_CLAVE_PROPIETARIO:?defina SIGIT_CLAVE_PROPIETARIO}
      SIGIT_CLAVE_APP: ${SIGIT_CLAVE_APP:?defina SIGIT_CLAVE_APP}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./docker/postgres-inicial.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    networks: [interna]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/Dockerfile }
    environment:
      SIGIT_CLAVE_SECRETA: ${SIGIT_CLAVE_SECRETA:?defina SIGIT_CLAVE_SECRETA}
      SIGIT_HOSTS: ${SIGIT_HOSTS:-localhost}
      SIGIT_ORIGENES_CONFIABLES: ${SIGIT_ORIGENES_CONFIABLES:-}
      SIGIT_HTTPS: ${SIGIT_HTTPS:-1}
      SIGIT_DETRAS_DE_PROXY: "1"
      SIGIT_PROXIES_DE_CONFIANZA: ${SIGIT_PROXIES_DE_CONFIANZA:-1}
      SIGIT_MIGRAR: "1"
      DATABASE_URL: postgres://sigit_app:${SIGIT_CLAVE_APP}@db:5432/paid_sigit
      DATABASE_URL_MIGRACIONES: postgres://sigit_propietario:${SIGIT_CLAVE_PROPIETARIO}@db:5432/paid_sigit
    volumes:
      - adjuntos:/datos/adjuntos
    depends_on:
      db: { condition: service_healthy }
    networks: [interna]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SIGIT_PUERTO:-8080}:80"
    depends_on: [web]
    networks: [interna]
    restart: unless-stopped

volumes:
  datos-postgres:
  adjuntos:

networks:
  interna:
