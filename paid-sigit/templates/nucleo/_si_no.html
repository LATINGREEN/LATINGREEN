<fieldset class="campo">
  <legend>{{ campo.label }}{% if campo.field.required %} <span class="obligatorio" aria-hidden="true">*</span>{% endif %}</legend>
  <div class="opciones-si-no">
    {% for opcion in campo %}<label>{{ opcion.tag }} {{ opcion.choice_label }}</label>{% endfor %}
  </div>
  {% for error in campo.errors %}<span class="error" role="alert"><svg width="16" height="16"><use href="#i-alerta"/></svg>{{ error }}</span>{% endfor %}
</fieldset>
